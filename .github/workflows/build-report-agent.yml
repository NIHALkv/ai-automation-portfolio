# Builds report_agent.exe on Windows, tests it against the mock platform,
# then publishes it as the "report-agent-latest" release.
#
# The platform address is NOT in the code. Set it once in GitHub:
#   Settings > Secrets and variables > Actions > Variables > New variable
#   Name: PLATFORM_URL   Value: https://your-platform-address
name: Build Report Agent exe

on:
  push:
    branches: [main]
    paths:
      - "01-report-download-agent/**"
      - ".github/workflows/build-report-agent.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: 01-report-download-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install playwright openpyxl pyinstaller flask

      - name: Fetch brand font (Plus Jakarta Sans, OFL)
        shell: pwsh
        continue-on-error: true
        run: Invoke-WebRequest "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" -OutFile branding/PlusJakartaSans.ttf

      - name: Build exe (windowed app, PF branding, platform address built in)
        shell: pwsh
        env:
          PLATFORM_URL: ${{ vars.PLATFORM_URL }}
        run: |
          $data = @("--add-data", "branding;branding")
          if ($env:PLATFORM_URL) {
            @{ base_url = $env:PLATFORM_URL.TrimEnd('/') } | ConvertTo-Json | Set-Content -Encoding utf8 built_in.json
            $data += @("--add-data", "built_in.json;.")
            Write-Host "Platform address built in."
          } else {
            Write-Host "::warning::PLATFORM_URL variable not set - the app will ask for the address once."
          }
          pyinstaller --onefile --windowed --name report_agent --icon branding/pf-icon.ico --collect-all playwright @data report_agent_gui.py

      - name: Smoke test the app against the mock platform (uses Edge, simulated SSO)
        shell: pwsh
        run: |
          $env:MOCK_SSO = "1"
          Start-Process python -ArgumentList "tests/mock_platform.py","5055","5" -WorkingDirectory $PWD -WindowStyle Hidden
          Start-Sleep -Seconds 4
          '{"base_url": "http://127.0.0.1:5055", "post_trigger_wait_s": 5, "headless": true}' | Set-Content -Encoding utf8 dist/config.json
          $out = "$env:RUNNER_TEMP\reports"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force "$env:APPDATA\ReportAgent" | Out-Null
          @{ download_root = $out; reports = @() } | ConvertTo-Json | Set-Content -Encoding utf8 "$env:APPDATA\ReportAgent\settings.json"
          $env:REPORT_AGENT_AUTOSTART = "1"   # app clicks "Download reports" itself and closes when done
          $p = Start-Process dist\report_agent.exe -PassThru -Wait
          Write-Host "App exit code: $($p.ExitCode) (2 = PARTIAL, expected: the mock has one broken report)"
          if (Test-Path "$env:APPDATA\ReportAgent\app_log.txt") { Get-Content "$env:APPDATA\ReportAgent\app_log.txt" | Select-Object -Last 15 }
          $files = Get-ChildItem -Recurse "$out" -Filter *.xlsx -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne "Download_Log.xlsx" }
          Write-Host "Downloaded files:"; $files | ForEach-Object { Write-Host "  $($_.Name)" }
          if ($files.Count -ne 3) { throw "Expected 3 downloaded reports, got $($files.Count)" }
          if (-not (Test-Path "$out\Download_Log.xlsx")) { throw "Run log missing" }
          Remove-Item dist/config.json
          Write-Host "Smoke test passed."
          $global:LASTEXITCODE = 0

      - name: Move the release tag to this commit
        working-directory: .
        run: |
          git tag -f report-agent-latest
          git push -f origin report-agent-latest

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: report-agent-latest
          name: Report Agent (latest)
          body: |
            Download **report_agent.exe** and double-click it. Click **Download reports**, sign in with your company account (SSO) in the browser the first time, and watch each report download.
            Tested automatically on Windows before release.
          files: 01-report-download-agent/dist/report_agent.exe
          make_latest: true
